name: TAREGH - Download from URLs & Save to Repo

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of URLs to download'
        required: true
        type: string
      mode:
        description: 'Download mode'

        required: false

        default: 'normal'

        type: choice

        options:
          - normal
          - zip

      split_threshold_mb:
        description: 'Split files larger than this MB (0 = never split)'
        required: false
        default: 90
        type: number

      download_subtitles:
        description: 'Download subtitle files'
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: 'Subtitle languages, comma-separated (e.g. en,fa)'
        required: false
        type: string
        default: 'en'
      


jobs:
  save-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aria2 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip

      - name: AVASAM Downloader - https://avasam.ir
        run: |
          echo "ðŸ·ï¸  AVASAM - Your Download Solution"
          echo "ðŸŒ https://avasam.ir"
          echo ""

      - name: Download files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          SPLIT_THRESHOLD_MB="${{ github.event.inputs.split_threshold_mb }}"
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))

          echo "ðŸ·ï¸  AVASAM (https://avasam.ir) - Downloading with mode: $MODE"
          echo "Split threshold: $SPLIT_THRESHOLD_MB MB"
          
          SUBTITLES="${{ github.event.inputs.download_subtitles }}"

          mkdir -p downloads tmp_downloads

          # Download each URL
          for URL in $URLS; do
            FILENAME=$(basename "$URL")
            echo "â¬‡ï¸ Downloading $URL -> $FILENAME"
            aria2c \
              --split=2 \
              --max-connection-per-server=2 \
              --min-split-size=90M \
              --dir="tmp_downloads" \
              --out="$FILENAME" \
              "$URL"

           # Subtitles
          SUBTITLE_ARGS=""
          if [ "$SUBTITLES" = "true" ]; then
            SUBTITLE_ARGS="--write-subs --write-auto-subs --sub-langs ${SUB_LANGS}"
          fi

          done

          # Zip all downloads if mode is 'zip'
          if [ "$MODE" = "zip" ]; then
            ARCHIVE_NAME="downloads/archive_$(date +%Y%m%d_%H%M%S).zip"
            echo "ðŸ“¦ Creating zip archive: $ARCHIVE_NAME"
            zip -j "$ARCHIVE_NAME" tmp_downloads/*
            rm -rf tmp_downloads
          else
            # Normal mode: handle splitting large files
            for FILE in tmp_downloads/*; do
              [ -f "$FILE" ] || continue
              SIZE=$(stat -c%s "$FILE")
              BASENAME=$(basename "$FILE")

              if [ "$SPLIT_THRESHOLD_BYTES" -gt 0 ] && [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
                echo "âœ‚ï¸ $BASENAME is $(( SIZE / 1024 / 1024 ))MB â€” splitting into ${SPLIT_THRESHOLD_MB}MB parts (zip-split)"
                # Create a zip split into parts that can be reassembled with `zip -F`
                zip -0 -s "${SPLIT_THRESHOLD_MB}m" "downloads/${BASENAME}.zip" -j "$FILE"
                echo "âœ… Parts: $(ls downloads/${BASENAME}.z* 2>/dev/null | wc -l)"
              else
                cp "$FILE" "downloads/$BASENAME"
              fi
            done
            rm -rf tmp_downloads
          fi

      - name: Commit & Push in batches of 5 files (AVASAM)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "ðŸ·ï¸  AVASAM (https://avasam.ir) - Preparing to commit files"

          # Collect all new/modified files under downloads/
          mapfile -t ALL_FILES < <(git ls-files --others --modified --exclude-standard downloads/)

          TOTAL=${#ALL_FILES[@]}
          echo "ðŸ“¦ Total files to push: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nothing to commit"
            exit 0
          fi

          BATCH_SIZE=5
          BATCH_NUM=0

          for (( i=0; i<TOTAL; i+=BATCH_SIZE )); do
            BATCH_NUM=$(( BATCH_NUM + 1 ))
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")

            echo "ðŸš€ Pushing batch $BATCH_NUM: files $((i+1))â€“$(( i + ${#BATCH[@]} )) of $TOTAL"

            git add "${BATCH[@]}"
            git commit -m "[AVASAM] Add downloaded files â€” batch $BATCH_NUM [skip ci]"

            # Pull with rebase before each push to avoid conflicts
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"

            echo "âœ… Batch $BATCH_NUM pushed"
          done

          echo "ðŸŽ‰ All $TOTAL files pushed in $BATCH_NUM batch(es) â€” AVASAM (https://avasam.ir)"
